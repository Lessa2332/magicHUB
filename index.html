<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Моніторинг результатів: 6 класи</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f8ff; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #3498db; margin-bottom: 30px; }
        
        .main-layout { display: flex; gap: 30px; }
        .sidebar { display: flex; flex-direction: column; gap: 15px; width: 200px; }
        .content { flex-grow: 1; }

        .btn { padding: 15px; cursor: pointer; border: none; border-radius: 50px; color: white; font-weight: bold; font-size: 1.1em; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn:hover { transform: scale(1.05); }
        
        /* Кольори класів як на картинці */
        .c6A { background: #bc4de0; }
        .c6B { background: #2ecc71; }
        .c6V { background: #3498db; }
        .c6G { background: #e67e22; }
        .c6D { background: #f1c40f; color: #555; }

        .chart-container { display: flex; align-items: flex-end; gap: 10px; height: 200px; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-top: 20px; }
        .bar { width: 50px; text-align: center; color: white; font-size: 12px; padding-top: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h1>МОНІТОРИНГ РЕЗУЛЬТАТІВ: 6 КЛАСИ. ГЕОГРАФІЯ</h1>
    <div class="main-layout">
        <div class="sidebar" id="btnGroup"></div>
        <div class="content" id="result">
            <p>Оберіть клас зліва, щоб побачити детальний моніторинг.</p>
        </div>
    </div>
</div>

<script>
    const data = {
        '6-А': { color: 'c6A', total: 20, p: 0, s: 0, d: 11, v: 9 },
        '6-Б': { color: 'c6B', total: 24, p: 0, s: 0, d: 14, v: 10 },
        '6-В': { color: 'c6V', total: 21, p: 0, s: 3, d: 11, v: 7 },
        '6-Г': { color: 'c6G', total: 20, p: 2, s: 6, d: 9, v: 3 },
        '6-Д': { color: 'c6D', total: 17, p: 0, s: 2, d: 11, v: 4 }
    };

    function showData(cls) {
        const d = data[cls];
        const qPercent = (((d.d + d.v) / d.total) * 100).toFixed(0);
        
        document.getElementById('result').innerHTML = `
            <h2>Результати ${cls}</h2>
            <table>
                <tr><th>Початковий</th><th>Середній</th><th>Достатній</th><th>Високий</th><th>Якість знань</th></tr>
                <tr><td>${d.p}</td><td>${d.s}</td><td>${d.d}</td><td>${d.v}</td><td><strong>${qPercent}%</strong></td></tr>
            </table>
            <div class="chart-container">
                <div class="bar c6G" style="height: ${d.p * 10}px">${d.p}</div>
                <div class="bar c6G" style="height: ${d.s * 10}px">${d.s}</div>
                <div class="bar c6D" style="height: ${d.d * 10}px">${d.d}</div>
                <div class="bar c6B" style="height: ${d.v * 10}px">${d.v}</div>
            </div>
        `;
    }

    const btnGroup = document.getElementById('btnGroup');
    Object.keys(data).forEach(cls => {
        const btn = document.createElement('button');
        btn.className = `btn ${data[cls].color}`;
        btn.innerText = cls;
        btn.onclick = () => showData(cls);
        btnGroup.appendChild(btn);
    });
</script>

</body>
</html>
