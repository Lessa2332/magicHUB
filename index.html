<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Моніторинг навчальних досягнень (Додаток 6)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        button { padding: 12px 25px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; transition: transform 0.2s, background 0.3s; color: white; }
        .btn-6a { background: #e74c3c; } .btn-6b { background: #3498db; } .btn-6v { background: #27ae60; } .btn-6g { background: #f1c40f; color: #333; }
        button:hover { transform: scale(1.05); }
        .content-box { padding: 20px; border-radius: 15px; background: #f9f9f9; border: 2px solid #ddd; min-height: 150px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table th, .data-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .data-table th { background-color: #34495e; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Моніторинг результатів (Додаток 6)</h1>
    <div class="btn-group">
        <button class="btn-6a" onclick="showClass('6-А')">6-А клас</button>
        <button class="btn-6b" onclick="showClass('6-Б')">6-Б клас</button>
        <button class="btn-6v" onclick="showClass('6-В')">6-В клас</button>
        <button class="btn-6g" onclick="showClass('6-Г')">6-Г клас</button>
    </div>
    
    <div id="display" class="content-box">
        <p style="text-align:center; color:#7f8c8d;">Оберіть клас, щоб переглянути результати моніторингу.</p>
    </div>
</div>

<script>
    const data = {
        '6-А': { гр1: 'Високий', гр2: 'Достатній', гр3: 'Високий' },
        '6-Б': { гр1: 'Достатній', гр2: 'Високий', гр3: 'Середній' },
        '6-В': { гр1: 'Високий', гр2: 'Високий', гр3: 'Достатній' },
        '6-Г': { гр1: 'Середній', гр2: 'Достатній', гр3: 'Високий' }
    };

    function showClass(className) {
        const d = data[className];
        document.getElementById('display').innerHTML = `
            <h3>Результати моніторингу: ${className}</h3>
            <table class="data-table">
                <tr><th>Група результатів</th><th>Рівень засвоєння</th></tr>
                <tr><td>ГР 1 (Дослідницька)</td><td>${d.гр1}</td></tr>
                <tr><td>ГР 2 (Аналітична)</td><td>${d.гр2}</td></tr>
                <tr><td>ГР 3 (Практична)</td><td>${d.гр3}</td></tr>
            </table>
        `;
    }
</script>

</body>
</html>
