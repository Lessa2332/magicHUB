<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магія Писанки: Твій Іменний Оберіг</title>
    <style>
        :root {
            --clay: #3e2723;
            --gold: #fbc02d;
            --red: #d32f2f;
            --bg: #fcfaf5;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--clay);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .wizard-container {
            width: 95%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .step { display: none; animation: slideUp 0.4s ease-out; }
        .step.active { display: block; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h2 { color: var(--red); margin-bottom: 15px; }
        .description { color: #666; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; }

        .options-grid { display: grid; gap: 10px; margin-bottom: 20px; }
        
        .option-btn {
            padding: 14px;
            border: 2px solid #f0f0f0;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            text-align: left;
        }

        .option-btn:hover { border-color: var(--gold); background: #fffdf9; }
        .option-btn.selected { border-color: var(--red); background: #fff5f5; font-weight: bold; }

        .color-dot { width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0; }

        input[type="text"], select.option-select {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 2px solid #eee;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .nav-btns { display: flex; gap: 10px; margin-top: 20px; }
        button.primary { background: var(--red); color: white; border: none; padding: 15px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; flex: 1; }
        button.secondary { background: #eee; border: none; padding: 15px; border-radius: 12px; cursor: pointer; }

        #prediction-text {
            background: #fff9e6;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid var(--gold);
            margin-top: 20px;
            font-style: italic;
            line-height: 1.6;
            text-align: left;
        }

        .bunny { width: 80px; position: fixed; bottom: 10px; right: 10px; opacity: 0.5; z-index: 1; }

        svg { width: 100%; max-width: 280px; margin: 0 auto; display: block; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1)); }
        canvas { display: none; }
    </style>
</head>
<body>

<img src="https://i.postimg.cc/76ZN7Zyr/3.png" class="bunny" alt="Зайчик">

<div class="wizard-container">
    <div class="step active" id="step1">
        <div style="font-size: 4rem; margin-bottom: 20px;">🐣</div>
        <h2>Як тебе звати, творцю?</h2>
        <p class="description">Впиши своє ім'я, щоб оберіг знав, кого захищати.</p>
        <input type="text" id="user-name" placeholder="Твоє ім'я..." maxlength="20">
        <button class="primary" onclick="nextStep(2)">Розпочати магію</button>
    </div>

    <div class="step" id="step2">
        <h2>Відчуття простору</h2>
        <div class="options-grid">
            <button class="option-btn" onclick="selectOption('soil', '#1a1a1a', 'Глибока тиша чорнозему', this)"><span class="color-dot" style="background:#1a1a1a"></span> Міць рідної землі</button>
            <button class="option-btn" onclick="selectOption('soil', '#b71c1c', 'Заграва степу', this)"><span class="color-dot" style="background:#b71c1c"></span> Вогонь та рух</button>
            <button class="option-btn" onclick="selectOption('soil', '#fbc02d', 'Золоті Карпати', this)"><span class="color-dot" style="background:#fbc02d"></span> Сонце та вершини</button>
            <button class="option-btn" onclick="selectOption('soil', '#0d47a1', 'Синє море', this)"><span class="color-dot" style="background:#0d47a1"></span> Спокій хвиль</button>
            <button class="option-btn" onclick="selectOption('soil', '#2e7d32', 'Лісове Полісся', this)"><span class="color-dot" style="background:#2e7d32"></span> Поклик природи</button>
            <button class="option-btn" onclick="selectOption('soil', '#ffffff', 'Ранкова роса', this)"><span class="color-dot" style="background:#ffffff; border:1px solid #ddd"></span> Чистота та світло</button>
        </div>
        <div class="nav-btns"><button class="secondary" onclick="nextStep(1)">←</button><button class="primary" onclick="nextStep(3)">Далі</button></div>
    </div>

    <div class="step" id="step3">
        <h2>Обери свій код</h2>
        <label>Небо (Духовне):</label>
        <select id="sel-sky" class="option-select">
            <option value="sky-sun">Восьмикутна Рожа (Енергія)</option>
            <option value="sky-star">Зоря (Новий шлях)</option>
            <option value="sky-birds">Птахи (Звістка)</option>
            <option value="sky-cloud">Грабельки (Дощ)</option>
            <option value="sky-swirl">Свастя (Рух)</option>
            <option value="sky-trident">Тризуб (Воля)</option>
            <option value="sky-bee">Бджола (Душа)</option>
        </select>
        
        <label>Земля (Буденне):</label>
        <select id="sel-earth" class="option-select">
            <option value="earth-deer">Олень (Гідність)</option>
            <option value="earth-oak">Дуб (Міцність)</option>
            <option value="earth-bereginya">Берегиня (Захист)</option>
            <option value="earth-horse">Кінь (Швидкість)</option>
            <option value="earth-tree">Дерево (Рід)</option>
            <option value="earth-wheat">Пшениця (Статок)</option>
            <option value="earth-flower">Квітка (Краса)</option>
        </select>

        <label>Вода (Внутрішнє):</label>
        <select id="sel-water" class="option-select">
            <option value="water-waves">Безконечник (Життя)</option>
            <option value="water-fish">Риба (Здоров'я)</option>
            <option value="water-duck">Качка (Родина)</option>
            <option value="water-rhomb">Ромб (Врожай)</option>
            <option value="water-well">Криниця (Мудрість)</option>
            <option value="water-trig">Тригвер (Час)</option>
            <option value="water-rake">Грабельки (Очищення)</option>
        </select>

        <div class="nav-btns"><button class="secondary" onclick="nextStep(2)">←</button><button class="primary" onclick="finishPysanka()">Створити оберіг</button></div>
    </div>

    <div class="step" id="step4">
        <div id="final-display"></div>
        <div id="prediction-text"></div>
        <div class="nav-btns">
            <button class="primary" onclick="saveAsPNG()">Зберегти PNG</button>
            <button class="secondary" onclick="restart()">🔄 Спочатку</button>
        </div>
    </div>
</div>

<div style="display:none">
    <svg id="master-svg" viewBox="0 0 200 260">
        <path id="egg-base" d="M100,10 C150,10 190,80 190,160 C190,230 150,250 100,250 C50,250 10,230 10,160 C10,80 50,10 100,10 Z" fill="#ffffff"/>
        <g stroke="white" stroke-width="1.2" fill="none" opacity="0.4"><path d="M15,95 Q100,85 185,95 M15,165 Q100,155 185,165"/></g>
        <g id="cont-sky" transform="translate(100, 55)"></g>
        <g id="cont-earth" transform="translate(100, 130)"></g>
        <g id="cont-water" transform="translate(100, 205)"></g>
        <text id="svg-name" x="100" y="275" font-family="Arial" font-size="12" fill="#3e2723" text-anchor="middle"></text>
        
        <defs>
            <g id="sky-sun" stroke="white" fill="none" stroke-width="2"><circle r="12"/><path d="M-20,0 H20 M0,-20 V20 M-14,-14 L14,14 M-14,14 L14,-14"/></g>
            <g id="sky-star" fill="white"><path d="M0,-25 L6,-6 L25,0 L6,6 L0,25 L-6,6 L-25,0 L-6,-6 Z"/></g>
            <g id="sky-birds" stroke="white" fill="none" stroke-width="2"><path d="M-20,0 Q-10,-10 0,0 Q10,-10 20,0 M0,0 V10"/></g>
            <g id="sky-cloud" stroke="white" stroke-width="2"><path d="M-20,0 H20 M-15,0 V10 M0,0 V10 M15,0 V10"/></g>
            <g id="sky-swirl" stroke="white" fill="none" stroke-width="2.5"><path d="M-15,-15 L15,15 M-15,15 L15,-15 M0,-20 V20 M-20,0 H20"/></g>
            <g id="sky-trident" stroke="white" fill="none" stroke-width="2"><path d="M-15,-10 V10 Q0,20 15,10 V-10 M0,-15 V15"/></g>
            <g id="sky-bee" stroke="white" fill="white"><circle r="3"/><ellipse cx="7" cy="0" rx="6" ry="3" fill="none"/><ellipse cx="-7" cy="0" rx="6" ry="3" fill="none"/></g>

            <g id="earth-deer" stroke="white" fill="none" stroke-width="2.5"><path d="M-20,10 H10 L18,-15 M10,10 V30 M-12,10 V30 M18,-15 L12,-25 M18,-15 L24,-25"/></g>
            <g id="earth-oak" fill="white"><path d="M0,0 Q15,-10 0,-30 Q-15,-10 0,0 M0,5 Q15,15 0,35 Q-15,15 0,5"/></g>
            <g id="earth-bereginya" stroke="white" fill="none" stroke-width="2"><circle cx="0" cy="-30" r="6" fill="white"/><path d="M-25,0 L0,-12 L25,0 M0,-12 V15 M-15,15 L0,8 L15,15"/></g>
            <g id="earth-horse" stroke="white" fill="none" stroke-width="2.5"><path d="M-20,20 H15 L25,0 M-10,20 V35 M10,20 V35 M25,0 L20,-15"/></g>
            <g id="earth-tree" stroke="white" fill="none" stroke-width="2"><path d="M0,30 V-20 M-20,0 L0,-10 L20,0 M-15,-15 L0,-25 L15,-15"/></g>
            <g id="earth-wheat" stroke="white" stroke-width="2"><path d="M0,30 V-10 M0,-10 L-8,-18 M0,-5 L-8,-13 M0,-10 L8,-18 M0,-5 L8,-13"/></g>
            <g id="earth-flower" fill="white"><circle r="5"/><circle cx="12" r="4"/><circle cx="-12" r="4"/><circle cy="12" r="4"/><circle cy="-12" r="4"/></g>

            <g id="water-waves" stroke="#81d4fa" fill="none" stroke-width="3"><path d="M-40,0 Q-20,-15 0,0 T40,0"/></g>
            <g id="water-fish" stroke="white" fill="none" stroke-width="2"><path d="M-30,0 C-10,-15 10,-15 30,0 C10,15 -10,15 -30,0 Z M30,0 L45,-8 V8 Z"/></g>
            <g id="water-duck" fill="white"><path d="M-20,0 Q0,-25 25,0 L30,12 H-30 Z M18,-8 Q28,-18 38,-8 L32,0 Z"/></g>
            <g id="water-rhomb" stroke="white" fill="none" stroke-width="2"><path d="M0,-20 L20,0 L0,20 L-20,0 Z"/><circle r="2" fill="white"/></g>
            <g id="water-well" stroke="white" stroke-width="2"><rect x="-15" y="-15" width="30" height="30" fill="none"/><line x1="-15" y1="-15" x2="15" y2="15"/><line x1="15" y1="-15" x2="-15" y2="15"/></g>
            <g id="water-trig" fill="white"><path d="M0,-15 L13,7 L-13,7 Z"/><circle r="3" cy="-5" fill="var(--red)"/></g>
            <g id="water-rake" stroke="white" stroke-width="2"><line x1="-30" y1="0" x2="30" y2="0"/><path d="M-20,0 V12 M0,0 V12 M20,0 V12"/></g>
        </defs>
    </svg>
</div>

<canvas id="export-canvas" width="800" height="1100"></canvas>

<script>
    let selections = { soil: '#1a1a1a', soilName: 'Земля' };
    const regionalPhrases = [
        "Ти як волинська писанка — несеш у собі міць прадавніх лісів.",
        "Твій дух — це вільний степ Слобожанщини та сила відкритого неба.",
        "У твоєму коді відчувається тепло Карпатських гір та сонячна енергія.",
        "Твоя душа глибока, як Чорне море, і спокійна, як вечірній прибій.",
        "Ти — голос Полісся, таємничий та сповнений життєвої сили.",
        "Твоє світло чисте, як київські світанки над Дніпром."
    ];

    function nextStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
    }

    function selectOption(category, value, name, btn) {
        selections[category] = value;
        selections[category + 'Name'] = name;
        btn.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function finishPysanka() {
        const name = document.getElementById('user-name').value || "Творець";
        const svg = document.getElementById('master-svg').cloneNode(true);
        svg.id = "final-svg";
        svg.querySelector('#egg-base').setAttribute('fill', selections['soil']);
        svg.querySelector('#svg-name').textContent = "Оберіг для: " + name;

        const zones = { 
            'cont-sky': document.getElementById('sel-sky').value, 
            'cont-earth': document.getElementById('sel-earth').value, 
            'cont-water': document.getElementById('sel-water').value 
        };

        for (const [contId, symId] of Object.entries(zones)) {
            const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
            use.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#" + symId);
            svg.getElementById(contId).appendChild(use);
        }

        document.getElementById('final-display').innerHTML = '';
        document.getElementById('final-display').appendChild(svg);

        // Поєднання з першою ідеєю (Випадкова фраза + логіка)
        const soilIndex = ['#1a1a1a', '#b71c1c', '#fbc02d', '#0d47a1', '#2e7d32', '#ffffff'].indexOf(selections.soil);
        const regionalBase = regionalPhrases[soilIndex] || regionalPhrases[0];
        
        const pred = `<b>${name}</b>, твоє таїнство завершено! <br><br>
        ${regionalBase} <br>
        Обраний тобою <b>${document.getElementById('sel-sky').selectedOptions[0].text}</b> дарує натхнення мріям. 
        <b>${document.getElementById('sel-earth').selectedOptions[0].text}</b> захищає твій дім, 
        а <b>${document.getElementById('sel-water').selectedOptions[0].text}</b> наповнює серце мудрістю.`;
        
        document.getElementById('prediction-text').innerHTML = pred;
        nextStep(4);
    }

    function saveAsPNG() {
        const svg = document.getElementById('final-svg');
        const canvas = document.getElementById('export-canvas');
        const ctx = canvas.getContext('2d');
        const xml = new XMLSerializer().serializeToString(svg);
        const img = new Image();
        img.onload = function() {
            ctx.fillStyle = "#fcfaf5";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 100, 50, 600, 900);
            const link = document.createElement('a');
            link.download = 'pysanka_oberig.png';
            link.href = canvas.toDataURL();
            link.click();
        };
        img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
    }

    function restart() {
        document.getElementById('user-name').value = '';
        nextStep(1);
    }
</script>
</body>
</html>
