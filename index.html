<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Моніторинг результатів 6 класів</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: #3498db; color: white; transition: 0.3s; }
        button:hover { background: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #3498db; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Інтерактивний моніторинг географії (2025-2026)</h1>
    <div class="btn-group" id="btnGroup"></div>
    <div id="result"></div>
</div>

<script>
    const data = {
        '6-А': { total: 20, p: 0, s: 0, d: 11, v: 9, q: 20 },
        '6-Б': { total: 24, p: 0, s: 0, d: 14, v: 10, q: 24 },
        '6-В': { total: 21, p: 0, s: 3, d: 11, v: 7, q: 18 },
        '6-Г': { total: 20, p: 2, s: 6, d: 9, v: 3, q: 12 },
        '6-Д': { total: 17, p: 0, s: 2, d: 11, v: 4, q: 15 }
    };

    function showData(cls) {
        const d = data[cls];
        const qPercent = ((d.q / d.total) * 100).toFixed(0);
        document.getElementById('result').innerHTML = `
            <h2>Результати ${cls}</h2>
            <table>
                <tr><th>Рівень</th><th>Кількість</th></tr>
                <tr><td>Початковий</td><td>${d.p}</td></tr>
                <tr><td>Середній</td><td>${d.s}</td></tr>
                <tr><td>Достатній</td><td>${d.d}</td></tr>
                <tr><td>Високий</td><td>${d.v}</td></tr>
                <tr><td><strong>Якість знань</strong></td><td><strong>${qPercent}%</strong></td></tr>
            </table>
        `;
    }

    const btnGroup = document.getElementById('btnGroup');
    Object.keys(data).forEach(cls => {
        const btn = document.createElement('button');
        btn.innerText = cls;
        btn.onclick = () => showData(cls);
        btnGroup.appendChild(btn);
    });
</script>

</body>
</html>
